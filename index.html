<style>
/* Layout: full-height game screen. A canvas "microscope field" fills the stage; menus are panels laid over it. Single dark world by choice. */
:root{
  --bg:#0B100D; --panel:rgba(16,23,19,.94); --panel2:#1C2821; --ink:#EEEADF; --muted:#9AA89D; --line:#2A3830;
  --amber:#E9B44C; --water:#5DB2E8; --moss:#A6C682; --bad:#EA8B7B; --sex:#E7B6D6;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;background:none;border:0;padding:0}
.brand svg{width:24px;height:24px}
.tb{display:flex;gap:8px}
.chipbtn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.chipbtn:hover{border-color:var(--amber)}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center}
.screen{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 30px 60px -30px #000;max-width:100%}
canvas{display:block;touch-action:none;max-width:100%}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:rgba(6,10,8,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow:auto}
.card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.card h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1;letter-spacing:-.025em;margin:0}
.card h1 .sci{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--amber);letter-spacing:0}
.card h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em;margin:0}
.card p{margin:0}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:15px}
.btn.go{background:var(--amber);color:#1B1408}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.stages{grid-template-columns:1fr}}
.sc{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sc:hover{border-color:var(--amber)}
.sc b{font-size:15px}
.sc span{font-size:12.5px;color:var(--muted)}
.sc .done{color:var(--moss);font-family:var(--mono);font-size:11px}
.terms{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.terms li{background:var(--panel2);border-radius:9px;padding:8px 11px;font-size:13.5px}
.terms b{display:block;color:var(--amber);font-weight:600}
.ctrl{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--ink)}
.big{font-family:var(--mono);font-size:30px;font-variant-numeric:tabular-nums;color:var(--amber)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:rgba(8,12,10,.86);border:1px solid rgba(233,180,76,.35);border-radius:11px;padding:8px 13px;font-size:13.5px;line-height:1.35;pointer-events:none;opacity:0;transition:opacity .35s, transform .35s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast b{color:var(--amber);font-weight:600}
.hint{font-size:12px;color:var(--muted);text-align:center}
.stars{color:var(--amber);font-size:.75em;letter-spacing:2px;white-space:nowrap}
.grp{margin-top:2px}
@media (min-width:521px){.stages.s3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.toast.top{top:64px;bottom:auto}
.tpad{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
.tbtn{pointer-events:auto;width:88px;height:66px;border-radius:14px;background:rgba(10,14,12,.55);border:1.5px solid rgba(238,234,223,.55);color:#EEEADF;font:700 20px/1 var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:none;-webkit-user-select:none;user-select:none}
.tbtn span{font-size:11px;letter-spacing:.1em}
.tbtn.on{background:rgba(233,180,76,.38);border-color:var(--amber)}
.rot{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:24px}
.rotcard{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:340px}
.rotcard h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em}
.rotcard svg{width:70px;height:70px;animation:tilt 2.4s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.diffs{grid-template-columns:1fr}}
.dcard{background:var(--panel2);border:1.5px solid;border-radius:12px;padding:10px 10px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.dcard b{font-family:var(--display);font-weight:800;font-size:19px}
.dcard span{font-size:12px;color:var(--muted);line-height:1.3}
.dcard.d0{border-color:#7DC890}.dcard.d0 b{color:#7DC890}
.dcard.d1{border-color:#E9B44C}.dcard.d1 b{color:#E9B44C}
.dcard.d2{border-color:#EA8B7B}.dcard.d2 b{color:#EA8B7B}
.dcard:hover{background:rgba(255,255,255,.06)}
.qh{font-size:21px!important;line-height:1.25!important}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;color:var(--ink)}
.qopt:hover{border-color:var(--amber)}
.qopt.good{border-color:#7DC890;background:rgba(125,200,144,.16)}
.qopt.bad{border-color:#EA8B7B;background:rgba(234,139,123,.16)}
.qfb{font-size:14px;background:var(--panel2);border-radius:9px;padding:10px 12px;margin:0}
.qfb b{color:var(--amber)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.legend div{display:flex;gap:8px;align-items:baseline}
.legend i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--amber);min-width:62px}
@media (max-width:520px){.legend{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

<script>
/* ============ helpers ============ */
const TAU=Math.PI*2,TW=1024,VIEW=320;let LH=VIEW;

const ease=t=>1-Math.pow(1-clamp(t),3);

const rnd=Math.random,rr=(a,b)=>a+rnd()*(b-a);

let c;
function lg(x0,y0,x1,y1,s,cc=c){const g=cc.createLinearGradient(x0,y0,x1,y1);s.forEach(([o,k])=>g.addColorStop(o,k));return g}
function rg(x0,y0,r0,x1,y1,r1,s,cc=c){const g=cc.createRadialGradient(x0,y0,r0,x1,y1,Math.max(r0+.01,r1));s.forEach(([o,k])=>g.addColorStop(o,k));return g}
function circ(x,y,r,cc=c){cc.beginPath();cc.arc(x,y,Math.max(0,r),0,TAU)}
function ell(x,y,rx,ry,rot=0,cc=c){cc.beginPath();cc.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot,0,TAU)}
function blob(x,y,r,n,R,cc=c){cc.beginPath();for(let i=0;i<=n;i++){const a=i/n*TAU,k=r*(.75+.35*R());const px=x+Math.cos(a)*k,py=y+Math.sin(a)*k;i?cc.lineTo(px,py):cc.moveTo(px,py)}cc.closePath()}

const SFX={collect:()=>tone(660,.12,'sine',.1,1.5),water:()=>tone(420,.16,'sine',.1,1.8),hit:()=>tone(150,.28,'triangle',.2,.5),power:()=>[523,659,784].forEach((f,i)=>tone(f,.14,'square',.045,1,i*.07)),fuse:()=>[392,494,587,784].forEach((f,i)=>tone(f,.6,'sine',.07,1,i*.06)),clear:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.24,'triangle',.09,1,i*.11)),over:()=>[392,330,262].forEach((f,i)=>tone(f,.32,'triangle',.09,1,i*.16)),pop:()=>tone(900,.09,'square',.05,.3),launch:()=>{tone(220,.35,'sawtooth',.06,5);tone(1300,.05,'square',.05)}};

function chargeSet(p){if(chargeOsc)chargeOsc.o.frequency.setTargetAtTime(180+p*520,AC.currentTime,.02)}

/* ============ content ============ */
const STAGES=[
 {id:'germ',name:'Germ tube',bg:'soil',goal:3200,speed:105,drain:.75,doneTitle:'A mycelium is born',done:'One basidiospore became a branching network of hyphae that can explore the soil for food.',

 {id:'wood',name:'Into the wood',bg:'wood',goal:5000,speed:115,doneTitle:'White rot',done:'Your mycelium is digesting the branch from the inside, stripping lignin and cellulose and leaving the wood pale and stringy.',

 {id:'soil',name:'Crowded soil',bg:'soil2',goal:5000,speed:125,doneTitle:'A partner in the roots',done:'Past the competitors, your hyphae reached a tree root and formed an ectomycorrhiza: soil nutrients for the tree, sugar for you.',

 {id:'rust',name:'Rust in a leaf',hy:'dik',bg:'leaf',goal:4200,speed:105,drain:.9,

  if(mode==='launch')drawLaunch();else if(mode==='scene'){SCENES[G.scene].draw(G.sceneT)}
  else{drawBg(G.S.bg,G.cam);G.ents.filter(E=>['dry','strepto','uv','bact','hostcell','hr'].includes(E.type)).forEach(drawEnt);G.ents.filter(E=>E.type==='wall').forEach(drawEnt);drawSpore();
   G.ents.filter(E=>['glucose','cellulose','water','laccase','melanin','mate','tricho','alga','fungicide','usnic','rival'].includes(E.type)).forEach(drawEnt);drawMyHypha();G.ents.filter(E=>E.type==='springtail').forEach(drawEnt);
   G.fx.forEach(p=>{if(p.k==='txt'){c.globalAlpha=clamp(1.3-p.l);c.font='600 12px Figtree, system-ui, sans-serif';c.fillStyle=p.col;c.textAlign='center';c.fillText(p.txt,p.x-G.cam,p.y-p.l*26);c.textAlign='left';c.globalAlpha=1}else{c.globalAlpha=clamp(1-p.l/.8);c.fillStyle=p.k==='crumb'?'#E9DCC0':p.col;circ(p.x-(p.k==='crumb'?0:G.cam)+(p.k==='crumb'?-G.cam:0),p.y,p.k==='crumb'?1.6:1.8);c.fill();c.globalAlpha=1}});
   G.dof.forEach(d=>{d.x-=(mode==='play'?G.speed:60)*d.z*.016;if(d.x<-40){d.x=LW+40;d.y=rnd()*LH}c.fillStyle=rg(d.x,d.y,1,d.x,d.y,d.r,[[0,`rgba(250,240,220,${d.a})`],[1,'rgba(250,240,220,0)']]);c.fillRect(d.x-d.r,d.y-d.r,2*d.r,2*d.r)});
   if(G.weather==='rain'){c.strokeStyle='rgba(205,228,250,.4)';c.lineWidth=1;for(let i=0;i<70;i++){const x=(i*97+G.t*380)%LW,y=(i*53+G.t*720)%LH;c.beginPath();c.moveTo(x,y);c.lineTo(x-3,y+12);c.stroke()}}
   if(G.weather==='drought'&&!G.dormant){c.fillStyle='rgba(255,220,150,.08)';c.fillRect(0,0,LW,LH)}
   if(G.dormant){c.fillStyle='rgba(120,115,105,.38)';c.fillRect(0,0,LW,LH)}
   if(G.inUV){c.fillStyle='rgba(200,170,255,.08)';c.fillRect(0,0,LW,LH)}
   if(mode==='play'&&!arcade&&stageIdx===0&&G.t<7&&!G.moved){const x=tipX()+34,y=G.y,b=Math.sin(G.t*4)*10;c.font='600 15px Figtree, system-ui, sans-serif';c.fillStyle='rgba(255,246,222,.95)';c.fillText('Drag up or down to steer',x+24,y+5);c.strokeStyle='rgba(255,246,222,.9)';c.lineWidth=2;c.beginPath();c.moveTo(x+8,y-18+b);c.lineTo(x+8,y+18+b);c.moveTo(x+2,y-10+b);c.lineTo(x+8,y-18+b);c.lineTo(x+14,y-10+b);c.moveTo(x+2,y+10+b);c.lineTo(x+8,y+18+b);c.lineTo(x+14,y+10+b);c.stroke()}}
  c.restore();
  c.fillStyle=rg(LW/2,LH/2,LH*.45,LW/2,LH/2,LW*.62,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.55)']]);c.fillRect(0,0,LW,LH);
  if(mode==='play'||mode==='paused')hud()}

/* ============ screens ============ */
const ov=html=>{ovEl.innerHTML=html;ovEl.hidden=!html};
const pauseBtn=document.getElementById('pauseBtn'),skipBtn=document.getElementById('skipBtn');
const envBest=id=>(prog.envBest||{})[id]||0;
const starStr=id=>{const n=(prog.stars||{})[id];return n?` · <span class="stars">${'★'.repeat(n)}${'☆'.repeat(3-n)}</span>`:(prog.done[id]?' · <span class="done">cleared</span>':'')};
const stageCard=(s,i)=>`<button class="sc" data-a="intro" data-i="${i}"><span class="lbl">Stage ${i+1}${starStr(s.id)}</span><b>${s.name}</b><span>${s.sub.split('. ')[0].replace(/\.$/,'')}.</span></button>`;
function menu(){chargeStop();toastEl.classList.remove('top');skipBtn.hidden=true;if(G)(G.capT||[]).forEach(clearTimeout);mode='menu';pauseBtn.hidden=true;newGame(0,false);G.demo=true;G.spore=null;G.trail=[];let s=0,prev=null;for(let x=-40;x<=tipX();x+=4){const y=LH/2;if(prev)s+=Math.hypot(x-prev.x,y-prev.y);G.trail.push({x,y,s});prev={x,y}}G.sLen=s;
  ov(`<div class="card"><span class="lbl">A mycology arcade game</span><h1>Hypha <span class="sci">Run</span></h1>
  <p class="muted">You are the growing tip of a fungal hypha. Steer through soil and wood, feed on sugars, keep your turgor up, and survive competitors long enough to find a mate and fruit.</p>
  <span class="lbl grp">A mushroom’s life cycle</span><div class="stages">${STAGES.slice(0,4).map((s,i)=>stageCard(s,i)).join('')}</div><span class="lbl grp">Other fungal lifestyles</span><div class="stages s3">${STAGES.slice(4).map((s,i)=>stageCard(s,i+4)).join('')}</div>
  <div class="row"><button class="btn go" data-a="arcade">Arcade mode</button><span class="muted" style="font-size:13px">Best: ${Math.round(prog.best).toLocaleString()} µm</span></div>
  <p class="muted" style="font-size:13px">Every habitat has two ways to play: <b>Stage</b>, where you reach a µm goal and earn stars, and <b>Endless</b>, with no finish line and a best distance saved for that habitat.</p>
  <p class="ctrl">Steer: drag or move the pointer up and down, or use <span class="kbd">↑</span> <span class="kbd">↓</span> (or <span class="kbd">W</span> <span class="kbd">S</span>). Pause: <span class="kbd">P</span>.</p></div>`)}
function intro(i){mode='intro';stageIdx=i;const S=STAGES[i];ov(`<div class="card"><span class="lbl">Stage ${i+1} of ${STAGES.length}</span><h2>${S.name}</h2><p>${S.sub}</p><p class="muted">${S.task}</p>
  <ul class="terms">${S.terms.slice(0,3).map(([a,b])=>`<li><b>${a}</b>${b}</li>`).join('')}</ul>
  <span class="lbl">Stage goal: grow ${Math.round(S.goal*.5).toLocaleString()} <span style="text-transform:none">µm</span> · pick a level to start</span>
  <div class="diffs">${DIFF.map((d,k)=>`<button class="dcard d${k}" data-a="play" data-d="${k}"><b>${d.n}</b><span>${d.desc}</span></button>`).join('')}</div>
  <div class="row"><button class="btn ghost" data-a="menu">Back</button><button class="btn ghost" data-a="endless" title="No finish line: grow as far as you can">Endless${envBest(S.id)?` · best ${Math.round(envBest(S.id)).toLocaleString()} µm`:""}</button></div></div>`)}
function start(i,arc,end){newGame(i,arc,end);mode='play';ov('');pauseBtn.hidden=false;pauseBtn.textContent='Pause';pointerY=null;setTimeout(()=>{if(mode!=='play')return;const S=STAGES[i];const h=arc?'<b>Arcade</b>: grow as far as you can. Speed keeps rising.':end?'<b>Endless</b>: no finish line. Grow as far as you can while the speed keeps rising. Your best distance is saved for this habitat.':S.hint||(S.id==='germ'?FACTS.start:S.id==='mate'?FACTS.mate:'');if(h)toast(h)},500)}
function gameOver(why){mode='over';pauseBtn.hidden=true;SFX.over();chargeStop();const um=Math.round(G.sLen*.5);let rec='';if(arcade&&um>prog.best){prog.best=um;persist();rec='<span class="lbl" style="color:var(--amber)">New best</span>'}if(endless){prog.envBest=prog.envBest||{};const id=G.S.id;if(um>(prog.envBest[id]||0)){prog.envBest[id]=um;persist();rec='<span class="lbl" style="color:var(--amber)">New best for this habitat</span>'}else rec=`<span class="lbl">Best here: ${Math.round(prog.envBest[id]).toLocaleString()} µm</span>`}
  ov(`<div class="card"><span class="lbl">Growth stopped</span><h2>${why==='carbon'?'Out of carbon':'Turgor lost'}</h2><p>${why==='carbon'?'Without sugars, the tip cannot build new wall or membrane, so extension stops.':'Without water, turgor pressure falls and can no longer push the tip forward.'}</p>
  <div><span class="big">${um.toLocaleString()} µm</span> ${rec}</div><div class="row"><button class="btn ghost" data-a="menu">Menu</button><button class="btn go" data-a="${arcade?'arcade':endless?'endless':'play'}">Try again</button></div></div>`)}
function endStage(){toastEl.classList.remove('top');skipBtn.hidden=true;(G.capT||[]).forEach(clearTimeout);pauseBtn.hidden=true;chargeStop();const id=STAGES[stageIdx].id;if(!G.quiz&&QUIZ[id]&&!arcade&&!endless){mode='clear';G.quiz={i:0,score:0,done:false};quizCard();return}showClear()}
function quizCard(){const id=STAGES[stageIdx].id,q=QUIZ[id][G.quiz.i];G.quiz.done=false;ov(`<div class="card"><span class="lbl">Check your understanding · question ${G.quiz.i+1} of ${QUIZ[id].length}</span><h2 class="qh">${q.q}</h2><div class="qopts">${q.o.map((o,k)=>`<button class="qopt" data-a="qans" data-k="${k}">${o}</button>`).join('')}</div><p class="qfb" id="qfb" hidden></p><div class="row"><span class="muted" style="font-size:12.5px">No timer. Take your time.</span><button class="btn go" data-a="qnext" id="qnext" hidden>${G.quiz.i+1<QUIZ[id].length?'Next question':'See results'}</button></div></div>`)}
function quizAnswer(k){if(G.quiz.done)return;G.quiz.done=true;const q=QUIZ[STAGES[stageIdx].id][G.quiz.i],ok=k===q.a;if(ok){G.quiz.score++;SFX.collect()}else SFX.hit();ovEl.querySelectorAll('.qopt').forEach((b,i)=>{if(i===q.a)b.classList.add('good');else if(i===k)b.classList.add('bad');b.disabled=true});const fb=document.getElementById('qfb');fb.hidden=false;fb.innerHTML=`<b>${ok?'Right.':'Not quite.'}</b> ${q.e}`;document.getElementById('qnext').hidden=false}
function showClear(){mode='clear';toastEl.classList.remove('top');skipBtn.hidden=true;(G.capT||[]).forEach(clearTimeout);pauseBtn.hidden=true;chargeStop();const S=STAGES[stageIdx];const st=G.launchStars||(G.carbon>=60?3:G.carbon>=30?2:1);prog.done[S.id]=1;prog.stars=prog.stars||{};prog.stars[S.id]=Math.max(prog.stars[S.id]||0,st);persist();SFX.clear();const last=stageIdx===STAGES.length-1;
  ov(`<div class="card"><span class="lbl">Stage ${stageIdx+1} cleared · ${DIFF[diff].n} · ${S.id==='pilo'?'best shot '+G.L.best.toFixed(2)+' m':Math.round(G.sLen*.5).toLocaleString()+' µm'}</span><h2>${S.doneTitle||'Stage clear'} <span class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span></h2>${S.done?`<p>${S.done}</p>`:''}
  ${G.quiz?`<p style="font-size:14px"><b>Quiz:</b> ${G.quiz.score} of ${QUIZ[S.id].length} correct</p>`:''}<p class="muted" style="font-size:13px">${S.id==='pilo'?'Stars: a best shot of 1.2 m earns two, 1.8 m earns three.':'Stars come from the carbon you finish with: 30 earns two, 60 earns three.'}</p>
  <ul class="terms">${S.terms.map(([a,b])=>`<li><b>${a}</b>${b}</li>`).join('')}</ul>
  <div class="row"><button class="btn ghost" data-a="menu">Menu</button><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-a="play">Replay</button>${last?'<button class="btn go" data-a="arcade">Play arcade</button>':`<button class="btn go" data-a="intro" data-i="${stageIdx+1}">Next stage</button>`}</span></div></div>`)}
function guide(){const was=mode;if(mode==='play')mode='paused';ov(`<div class="card"><span class="lbl">Field guide</span><h2>What you meet on the way</h2>
  <div class="legend">${[['glucose','Simple sugar. +carbon'],['cellulose','Wood polymer fragments. +carbon'],['water','Droplet. +turgor'],['dry pore','Air-filled. Drains water'],['wall','Lignified end wall with pits'],['laccase','Bore through lignin'],['melanin','Shield from Trichoderma'],['halo','Streptomyces antibiotics'],['Trichoderma','Mycoparasite, coils hyphae'],['springtail','Grazer, bites hyphae'],['A2 B2','Compatible mate'],['host cell','Brush the edge to feed'],['R gene','Resistant cell, avoid'],['alga','Photobiont. +carbon'],['UV','Screen with usnic acid'],['bacteria','Eat your sugars']].map(([a,b])=>`<div><i>${a}</i>${b}</div>`).join('')}</div>
  <ul class="terms">${GLOSS.map(([a,b])=>`<li><b>${a}</b>${b}</li>`).join('')}</ul>
  <div class="row"><span></span><button class="btn go" data-a="closeguide" data-was="${was}">Close</button></div></div>`)}
function pause(){if(mode==='play'){mode='paused';pauseBtn.textContent='Resume';ov(`<div class="card"><h2>Paused</h2><div class="row"><button class="btn ghost" data-a="menu">Quit to menu</button><button class="btn go" data-a="resume">Resume</button></div></div>`)}else if(mode==='paused')resume()}
function resume(){mode='play';pauseBtn.textContent='Pause';ov('');lastTs=0}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;audio();
  if(a==='mute'){muted=!muted;try{localStorage.setItem('hyphaRun.mute',muted?'1':'0')}catch(err){}b.textContent=muted?'Sound off':'Sound on';if(muted)chargeStop();return}
  if(a==='menu')menu();else if(a==='intro')intro(+b.dataset.i);else if(a==='play'){if(b.dataset.d!=null)diff=+b.dataset.d;start(stageIdx,false)}
  else if(a==='qans')quizAnswer(+b.dataset.k);else if(a==='qnext'){G.quiz.i++;if(G.quiz.i<QUIZ[STAGES[stageIdx].id].length)quizCard();else showClear()}
  else if(a==='rotok'||a==='rotguide'){rotDismissed=true;checkRot();if(a==='rotguide')guide()}else if(a==='endless')start(stageIdx,false,true);else if(a==='arcade')start(0,true);
  else if(a==='guide')guide();else if(a==='closeguide'){const w=b.dataset.was;if(w==='play'||w==='paused'){mode='play';pause()}else if(w==='intro')intro(stageIdx);else menu()}
  else if(a==='pause')pause();else if(a==='skip'){if(mode==='scene'&&!G.endShown){G.endShown=1;endStage()}}else if(a==='resume')resume()});
const kmap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{if(e.code==='Space'&&mode==='launch'){e.preventDefault();if(!e.repeat){audio();launchDown()}return}if(kmap[e.code]){keys[kmap[e.code]]=true;pointerY=null;if(mode==='play')e.preventDefault()}if(e.code==='KeyP'||e.code==='Escape')pause()});
addEventListener('keyup',e=>{if(e.code==='Space'&&mode==='launch'){launchUp();return}if(kmap[e.code])keys[kmap[e.code]]=false});
const py=e=>{const r=cv.getBoundingClientRect();return(e.clientY-r.top)/r.height*LH};
let drag=null,rotDismissed=false;const coarse=matchMedia('(pointer: coarse)').matches,tpad=document.getElementById('tpad'),rotEl=document.getElementById('rot');
function checkRot(){rotEl.hidden=!(coarse&&innerHeight>innerWidth&&!rotDismissed)}addEventListener('resize',checkRot);checkRot();
[['bUp','up'],['bDown','down']].forEach(([id,k])=>{const b=document.getElementById(id);const on=e=>{e.preventDefault();audio();keys[k]=true;pointerY=null;b.classList.add('on');b.setPointerCapture?.(e.pointerId)},off=()=>{keys[k]=false;b.classList.remove('on')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});
cv.addEventListener('pointerdown',e=>{audio();if(mode==='launch'){launchDown();return}if(e.pointerType==='mouse'){pointerY=py(e)}else{drag={y0:py(e),t0:G?G.target:LH/2};pointerY=null}cv.setPointerCapture?.(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag&&G){G.target=clamp(drag.t0+(py(e)-drag.y0)*1.4,18,LH-18)}else if(e.pointerType==='mouse')pointerY=py(e)});
const endDrag=()=>{drag=null;if(mode==='launch')launchUp()};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
document.getElementById('muteBtn').textContent=muted?'Sound off':'Sound on';
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});
resize();menu();requestAnimationFrame(frame);

/* ---- anonymous play metrics (Umami; no-op when the script is absent) ---- */
(function(){const T=(n,d)=>{try{window.umami&&window.umami.track(n,d)}catch(e){}};
 const dn=()=>['easy','medium','hard'][diff]||'medium',md=()=>arcade?'arcade':endless?'endless':'campaign',sid=()=>(G&&G.S&&G.S.id)||'arcade',um=()=>G?Math.round(G.sLen*.5):0,sec=()=>G?Math.round(G.t):0;
 const w=(f,before,after)=>function(...a){before&&before.apply(this,a);const r=f.apply(this,a);after&&after.apply(this,a);return r};
 start=w(start,null,()=>T('run_start',{stage:sid(),mode:md(),difficulty:dn()}));
 gameOver=w(gameOver,why=>T('run_game_over',{stage:sid(),mode:md(),difficulty:dn(),um:um(),seconds:sec(),cause:String(why||'').replace(/<[^>]*>/g,'').slice(0,60)}));
 showClear=w(showClear,null,()=>{const st=G.launchStars||(G.carbon>=60?3:G.carbon>=30?2:1);T('run_stage_clear',{stage:sid(),difficulty:dn(),um:um(),seconds:sec(),stars:st,quiz:G.quiz?G.quiz.score:null})});
 quizAnswer=w(quizAnswer,k=>{if(!G.quiz||G.quiz.done)return;const q=QUIZ[STAGES[stageIdx].id][G.quiz.i];T('run_quiz',{stage:sid(),question:G.quiz.i+1,correct:k===q.a})});
 let act=0,last=Date.now();setInterval(()=>{if(document.visibilityState==='visible'&&(mode==='play'||mode==='scene'||mode==='launch'))act+=1},1000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&act>=5){T('run_time',{seconds:act});act=0}});
})();
